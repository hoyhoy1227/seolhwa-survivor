<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>설화 서바이버 — Mountain Demons</title>
  <meta name="description" content="한국 설화 속 인물로 즐기는 브라우저 서바이벌 게임" />
  <style>
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#060612; color:#eee; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Helvetica Neue", Arial, sans-serif; }
    #game-container { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    /* pixelated scaling look */
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #hud { position:absolute; left:max(12px, env(safe-area-inset-left)); top:max(12px, env(safe-area-inset-top)); z-index:10; max-width:min(360px, calc(100vw - 40px)); background:rgba(0,0,0,0.62); padding:8px 10px; border:1px solid rgba(255,255,255,0.14); border-radius:8px; pointer-events:none; }
    #hud small { color:#ccc; display:block; margin-top:4px; font-size:12px; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="hud">
    <div id="charName">선택: -</div>
    <div id="stats">마법:0 물리:0 속도:0</div>
    <small id="bossTimer">보스 출현까지: --</small>
    <small>이동: 방향키 또는 WASD · 공격: 자동</small>
  </div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game code -->
  <script src="./src/game.js"></script>
</body>
</html>
