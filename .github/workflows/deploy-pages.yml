name: Manual Pages artifact deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare and verify static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R src assets _site/
          test -s _site/src/sprite-data.js
          test -s _site/assets/sprites/dokkaebi.png
          test -s _site/assets/sprites/treasure-chest.png
          test -s _site/assets/sprites/enemy-dokkaebi.png
          test -s _site/assets/sprites/enemy-gaksi.png
          test -s _site/assets/sprites/enemy-jeoseung.png
          test -s _site/assets/sprites/ground-forest-v2.png
          find _site -type f -maxdepth 4 -print

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
